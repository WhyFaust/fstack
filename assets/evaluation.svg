<svg xmlns="http://www.w3.org/2000/svg" width="600" height="328" viewBox="0 0 600 328" role="img" aria-labelledby="title desc">
  <title id="title">Сохранится ли новое значение?</title>
  <desc id="desc">Для одного ключа перебраны четыре позиции старой записи. Без проверки поколения новое значение потеряно только в последней позиции, когда новую запись уже опубликовали. С проверкой поколения и в контроле с одинаковым содержимым потерь нет.</desc>
  <rect width="600" height="328" rx="16" fill="#FAF6EE"/>
  <g fill="#291F23" font-family="Segoe UI, Arial, sans-serif">
    <text x="22" y="42" font-size="32" font-weight="700">Сохранится ли новое значение?</text>
    <g text-anchor="middle" font-size="21" font-weight="600">
      <text x="371" y="89">Позиция старой записи</text>
      <text x="551" y="89">Потери</text>
    </g>
    <g text-anchor="middle" font-size="20">
      <text x="296" y="118">1</text>
      <text x="346" y="118">2</text>
      <text x="396" y="118">3</text>
      <text x="446" y="118">4</text>
    </g>
    <path d="M22 129H578 M22 177H578 M22 225H578 M22 273H578" fill="none" stroke="#291F23" stroke-opacity=".25"/>
    <g font-size="22">
      <text x="22" y="161">Без проверки</text>
      <text x="22" y="209">С проверкой поколения</text>
      <text x="22" y="257">Одинаковые значения</text>
    </g>
    <g text-anchor="middle" font-size="23" font-weight="700">
      <text x="551" y="161" fill="#AF472B">1 из 4</text>
      <text x="551" y="209">0 из 4</text>
      <text x="551" y="257">0 из 4</text>
    </g>
    <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(0 153)">
        <path transform="translate(296 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(346 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(396 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(446 0)" d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#AF472B"/>
      </g>
      <g transform="translate(0 201)">
        <path transform="translate(296 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(346 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(396 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(446 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
      </g>
      <g transform="translate(0 249)">
        <path transform="translate(296 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(346 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(396 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
        <path transform="translate(446 0)" d="M-8 0 L-3 5 L8 -6" stroke="#216451"/>
      </g>
    </g>
    <g font-size="20">
      <path transform="translate(32 303)" d="M-8 0 L-3 5 L8 -6" stroke="#216451" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="310">Значение сохранилось</text>
      <path transform="translate(315 303)" d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#AF472B" fill="none" stroke-width="3.5" stroke-linecap="round"/>
      <text x="335" y="310">Значение потеряно</text>
    </g>
  </g>
</svg>
