<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="582" viewBox="0 0 1000 582" role="img" aria-labelledby="title desc">
  <title id="title">Как проверять изменение правил</title>
  <desc id="desc">Фиксируем гипотезу, сравниваем варианты на одинаковых задачах, проверяем поведение и стоимость. По доказательствам принимаем, дорабатываем, отклоняем или оставляем вывод неопределенным.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#f3e8e0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9c7562" stroke-width="1.5" stroke-linecap="round"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="580" rx="24" fill="url(#paper)" stroke="#e0d0c4"/>
  <g font-family="Segoe UI, Arial, sans-serif">
  <text x="40" y="44" font-size="13" fill="#986047" font-weight="700">ПРОВЕРКА ИЗМЕНЕНИЙ</text>
  <text x="40" y="88" font-size="32" fill="#362b25" font-weight="700">Идея становится гипотезой</text>
  <text x="40" y="121" font-size="18" fill="#67564d" font-weight="400">Сравнение должно допускать отказ от правки и отсутствие победителя.</text>
  <rect x="40" y="160" width="280" height="182" rx="18" fill="#ffffff" stroke="#dfd2c8"/>
  <text x="58" y="202" font-size="22" fill="#362b25" font-weight="700">1. До запуска</text>
  <text x="58" y="243" font-size="16" fill="#67564d" font-weight="400">Ошибка и ожидаемый выигрыш</text>
  <text x="58" y="271" font-size="16" fill="#67564d" font-weight="400">Риск ухудшить соседние задачи</text>
  <text x="58" y="299" font-size="16" fill="#67564d" font-weight="400">Критерии, повторы и бюджет</text>
  <rect x="360" y="160" width="280" height="182" rx="18" fill="#ffffff" stroke="#dfd2c8"/>
  <text x="378" y="202" font-size="22" fill="#362b25" font-weight="700">2. Равные условия</text>
  <text x="378" y="243" font-size="16" fill="#67564d" font-weight="400">Исходные запросы и снимки</text>
  <text x="378" y="271" font-size="16" fill="#67564d" font-weight="400">Свежие контексты вариантов</text>
  <text x="378" y="299" font-size="16" fill="#67564d" font-weight="400">Без готового решения</text>
  <rect x="680" y="160" width="280" height="182" rx="18" fill="#ffffff" stroke="#dfd2c8"/>
  <text x="698" y="202" font-size="22" fill="#362b25" font-weight="700">3. Проверка</text>
  <text x="698" y="243" font-size="16" fill="#67564d" font-weight="400">Поведение и совместимость</text>
  <text x="698" y="271" font-size="16" fill="#67564d" font-weight="400">Независимая оценка решения</text>
  <text x="698" y="299" font-size="16" fill="#67564d" font-weight="400">Время, токены, вмешательства</text>
  <path d="M 323 253 H 350" fill="none" stroke="#9c7562" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 643 253 H 670" fill="none" stroke="#9c7562" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="374" width="920" height="72" rx="18" fill="#f7e0d0" stroke="#dfd2c8"/>
  <text x="62" y="405" font-size="12" fill="#986047" font-weight="700">ВАРИАНТЫ</text>
  <text x="62" y="430" font-size="21" fill="#362b25" font-weight="600">Текущие правила   /   Предложенная правка   /   Более простая реализация</text>
  <path d="M 500 449 V 477" fill="none" stroke="#9c7562" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="490" width="296" height="58" rx="18" fill="#e6ede2" stroke="#dfd2c8"/>
  <text x="58" y="526" font-size="20" fill="#362b25" font-weight="600">Принять</text>
  <rect x="352" y="490" width="296" height="58" rx="18" fill="#f1dfd5" stroke="#dfd2c8"/>
  <text x="370" y="526" font-size="20" fill="#362b25" font-weight="600">Доработать или отклонить</text>
  <rect x="664" y="490" width="296" height="58" rx="18" fill="#e7e5ef" stroke="#dfd2c8"/>
  <text x="682" y="526" font-size="20" fill="#362b25" font-weight="600">Данных недостаточно</text>
  </g>
</svg>
