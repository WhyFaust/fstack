<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc">
  <title id="title">Как fstack выбирает путь от задачи к результату</title>
  <desc id="desc">Координатор отвечает по имеющимся данным или выбирает доступного агента с нужными инструментами и полномочиями. Для приёмки достаточно независимого прогона CI, проверившего критерий на актуальной ревизии. При нехватке доказательств координатор назначает проверку. Замечания получает автор. Исполнители возвращают сведения для памяти, координатор сверяет их и решает, что сохранить.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#865843" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="738" rx="24" fill="#fffaf3" stroke="#e5d7c9" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="40" y="42" fill="#9b4d31" font-size="13" font-weight="700" letter-spacing="2">РАБОЧИЙ ПРОЦЕСС</text>
    <text x="40" y="82" fill="#322921" font-size="30" font-weight="700">/faust-mode: путь к результату</text>
    <text x="40" y="113" fill="#6e6259" font-size="17">Координатор выбирает исполнителя по задаче, полномочиям и доступным инструментам.</text>

    <rect x="40" y="145" width="920" height="86" rx="16" fill="#f9e5d8" stroke="#dfb59d"/>
    <text x="65" y="181" fill="#322921" font-size="23" font-weight="700">Цель · полномочия · критерии</text>
    <text x="65" y="210" fill="#644a3d" font-size="17">Координатор определяет ожидаемый результат и границы действий.</text>

    <path d="M 175 231 V 277" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 660 231 V 277" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="40" y="290" width="270" height="142" rx="16" fill="#ffffff" stroke="#d9ccbf"/>
    <text x="65" y="326" fill="#6e6259" font-size="15" font-weight="700">ДАННЫХ ДОСТАТОЧНО</text>
    <text x="65" y="363" fill="#322921" font-size="23" font-weight="700">Прямой ответ</text>
    <text x="65" y="394" fill="#6e6259" font-size="17">Без отдельных поручений</text>
    <text x="65" y="418" fill="#6e6259" font-size="17">и лишних этапов</text>

    <rect x="410" y="290" width="550" height="142" rx="16" fill="#e7eff3" stroke="#b6cbd5"/>
    <text x="435" y="326" fill="#426578" font-size="15" font-weight="700">НУЖНА РАБОТА</text>
    <text x="435" y="363" fill="#322921" font-size="23" font-weight="700">Исполнитель и метод</text>
    <text x="435" y="394" fill="#435e6c" font-size="17">Подходящая роль из доступных в текущем чате</text>
    <text x="435" y="418" fill="#435e6c" font-size="17">В отчёте — результат, источник и вывод для памяти</text>

    <path d="M 660 432 V 479" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="410" y="492" width="550" height="120" rx="16" fill="#eaf0e4" stroke="#becdb2"/>
    <text x="435" y="529" fill="#322921" font-size="23" font-weight="700">Проверка по критериям</text>
    <text x="435" y="562" fill="#526547" font-size="17">Независимая проверка на текущей ревизии</text>
    <text x="435" y="590" fill="#526547" font-size="17">Ревью — по требованию или вопросу о коде</text>

    <path d="M 410 551 H 365 V 363 H 398" fill="none" stroke="#865843" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="350" y="559" transform="rotate(-90 350 559)" fill="#6e6259" font-size="14">Замечания автору</text>
    <path d="M 175 432 V 645" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 660 612 V 645" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="40" y="658" width="920" height="54" rx="14" fill="#43342d"/>
    <text x="500" y="692" fill="#fffaf3" font-size="20" font-weight="700" text-anchor="middle">Результат и ограничения · для изменения: проверенная ревизия</text>
  </g>
</svg>
