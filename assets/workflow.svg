<svg xmlns="http://www.w3.org/2000/svg" width="480" height="355" viewBox="0 0 480 355" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif" fill="#291F23">
  <title id="title">Выборка CI обнаружила сбой при повторном открытии</title>
  <desc id="desc">Обе команды pytest запущены локально. Когда файл active.lock перестали удалять, команда pytest tests/unit выбрала два теста, и оба прошли. Команда CI pytest -m quick выбрала три теста. Два прошли, повторное открытие завершилось ошибкой FileExistsError. После восстановления очистки та же команда прошла все три теста.</desc>

  <rect width="480" height="355" rx="12" fill="#FAF6EE"/>
  <path d="M12 0H468Q480 0 480 12V82H0V12Q0 0 12 0Z" fill="#291F23"/>
  <text x="20" y="38" font-size="30" font-weight="700" fill="#FFF7EF">Без очистки active.lock</text>
  <text x="20" y="68" font-size="20" fill="#F2D7C9">Обе команды выполнены локально.</text>

  <g font-size="18" font-weight="600">
    <text x="20" y="108">Команда</text>
    <g text-anchor="middle">
      <text x="264" y="108">Всего</text>
      <text x="348" y="108">Прошли</text>
      <text x="434" y="108">Сбои</text>
    </g>
  </g>
  <path d="M20 119H460 M20 167H460" fill="none" stroke="#C9BAAB" stroke-width="1.5"/>

  <text x="20" y="150" font-size="21" font-weight="600">pytest tests/unit</text>
  <text x="20" y="198" font-size="21" font-weight="600">pytest -m quick</text>
  <text x="20" y="220" font-size="17">Выборка CI</text>
  <g font-size="25" font-weight="600" text-anchor="middle">
    <text x="264" y="151">2</text>
    <text x="348" y="151">2</text>
    <text x="434" y="151">0</text>
    <text x="264" y="199">3</text>
    <text x="348" y="199">2</text>
    <rect x="412" y="173" width="44" height="35" rx="7" fill="#AF472B"/>
    <text x="434" y="199" fill="#FFFFFF">1</text>
  </g>
  <path d="M434 210v30h-35" fill="none" stroke="#AF472B" stroke-width="2"/>
  <text x="20" y="247" font-size="18" fill="#AF472B">Повторное открытие вызвало FileExistsError.</text>

  <rect x="12" y="266" width="456" height="77" rx="8" fill="#E1EDE4"/>
  <text x="24" y="293" font-size="18">После восстановления очистки</text>
  <text x="24" y="324" font-size="21" font-weight="600">pytest -m quick</text>
  <g fill="#216451">
    <path d="m268 316 5 5 11-12" fill="none" stroke="#216451" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="454" y="324" text-anchor="end" font-size="22" font-weight="700">3 из 3 прошли</text>
  </g>
</svg>
