<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">Области ответственности fstack</title>
  <desc id="desc">Навыки fstack задают метод. Codex предоставляет модели, инструменты и разрешения. Результат проверяется в проекте. Одобренные хуки и runtime обслуживают память в Obsidian.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#f3e8e0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9c7562" stroke-width="1.5" stroke-linecap="round"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="548" rx="24" fill="url(#paper)" stroke="#e0d0c4"/>
  <g font-family="Segoe UI, Arial, sans-serif">
  <text x="40" y="44" font-size="13" fill="#986047" font-weight="700">ОБЛАСТИ ОТВЕТСТВЕННОСТИ</text>
  <text x="40" y="88" font-size="32" fill="#362b25" font-weight="700">Метод, исполнение и память</text>
  <text x="40" y="121" font-size="18" fill="#67564d" font-weight="400">fstack описывает работу. Клиент предоставляет возможности и права.</text>
  <rect x="40" y="160" width="280" height="210" rx="18" fill="#fffdf9" stroke="#dfd2c8"/>
  <text x="62" y="202" font-size="27" fill="#362b25" font-weight="700">fstack</text>
  <text x="62" y="241" font-size="17" fill="#67564d" font-weight="400">Навыки и каталог</text>
  <text x="62" y="270" font-size="17" fill="#67564d" font-weight="400">Выбор метода и решения</text>
  <text x="62" y="299" font-size="17" fill="#67564d" font-weight="400">Критерии результата</text>
  <text x="62" y="347" font-size="14" fill="#986047" font-weight="600">Читаемые инструкции</text>
  <rect x="360" y="160" width="280" height="210" rx="18" fill="#f7e0d0" stroke="#dfd2c8"/>
  <text x="382" y="202" font-size="27" fill="#362b25" font-weight="700">Codex</text>
  <text x="382" y="241" font-size="17" fill="#67564d" font-weight="400">Модели и reasoning</text>
  <text x="382" y="270" font-size="17" fill="#67564d" font-weight="400">Агенты и инструменты</text>
  <text x="382" y="299" font-size="17" fill="#67564d" font-weight="400">Контекст и разрешения</text>
  <text x="382" y="347" font-size="14" fill="#986047" font-weight="600">Фактическое исполнение</text>
  <rect x="680" y="160" width="280" height="210" rx="18" fill="#fffdf9" stroke="#dfd2c8"/>
  <text x="702" y="202" font-size="27" fill="#362b25" font-weight="700">Проект</text>
  <text x="702" y="241" font-size="17" fill="#67564d" font-weight="400">Исходники и зависимости</text>
  <text x="702" y="270" font-size="17" fill="#67564d" font-weight="400">Стенд, тесты и CI</text>
  <text x="702" y="299" font-size="17" fill="#67564d" font-weight="400">Политики и потребители</text>
  <text x="702" y="347" font-size="14" fill="#986047" font-weight="600">Наблюдаемый результат</text>
  <path d="M 323 266 H 350" fill="none" stroke="#9c7562" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 643 266 H 670" fill="none" stroke="#9c7562" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="407" width="920" height="110" rx="18" fill="#44332c" stroke="#44332c"/>
  <text x="64" y="442" font-size="23" fill="#fff7ef" font-weight="700">Одобренные хуки → нативный runtime → Obsidian</text>
  <text x="64" y="479" font-size="18" fill="#e6c9b6" font-weight="400">Решения и поправки в заметках · привязки и очередь в профиле Codex</text>
  </g>
</svg>
