<svg xmlns="http://www.w3.org/2000/svg" width="600" height="478" viewBox="0 0 600 478" role="img" aria-labelledby="title desc">
  <title id="title">Как глубина запроса включает faust-mode</title>
  <desc id="desc">В обычном постоянном чате выбран ultra. Хук подтверждает глубину текущего хода и включает faust-mode. Координатор решает, нужна ли отдельная проверка. В примере он поручает сверку команд подагенту со свежим контекстом и задаёт low. В испытании с локальной моделью-заглушкой оба клиента передали low в запросе подагента. Следующий ход на high без ручного включения проходит в обычном режиме.</desc>

  <rect width="600" height="478" fill="#FAF6EE"/>

  <!-- По вертикали идут сообщения основного чата. Поручение ответвляется вправо. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 47V159" stroke="#216451" stroke-width="3"/>
    <path d="M32 162V396" stroke="#291F23" stroke-opacity=".48" stroke-width="2" stroke-dasharray="4 7"/>
    <path d="M32 183V248Q32 264 48 264H80M72 257l8 7-8 7" stroke="#AF472B" stroke-width="3"/>
  </g>
  <circle cx="32" cy="47" r="6" fill="#216451"/>
  <circle cx="32" cy="159" r="8" fill="#216451"/>
  <circle cx="32" cy="396" r="6" fill="#FAF6EE" stroke="#291F23" stroke-width="2.5"/>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#291F23">
    <text x="60" y="54" font-size="23" fill="#216451">Обычный чат · выбран ultra</text>
    <text x="58" y="98" font-size="32" font-weight="700">«Проверь изменения в проекте»</text>

    <text x="60" y="170" font-size="33" font-weight="700">Координатор <tspan fill="#216451">· ultra</tspan></text>
    <text x="60" y="205" font-size="23">Хук подтвердил глубину этого хода</text>
    <text x="60" y="233" font-size="23">и включил faust-mode.</text>

    <text x="96" y="272" font-size="22" fill="#AF472B">Если нужна отдельная проверка</text>
    <text x="95" y="310" font-size="31" font-weight="700">Подагент <tspan fill="#AF472B">· low</tspan></text>
    <text x="96" y="344" font-size="23">Сверяет команды в новом контексте.</text>

    <text x="60" y="405" font-size="29" font-weight="700">Следующий ход · high</text>
    <text x="60" y="441" font-size="23">Без /faust-mode чат работает как обычно.</text>
  </g>
</svg>
