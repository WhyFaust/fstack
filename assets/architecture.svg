<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Состав fstack и подключение к Codex</title>
  <desc id="desc">Команда /faust-mode включает процесс в чате до /faust-mode-off. Codex загружает навыки из установленного плагина. Координатор передаёт задания и методы доступным агентам Codex. Фоновый хук подбирает готовую сборку. Одобренные хуки находят рабочий vault и создают область проекта, нативный бинарник обслуживает память: заметки в Obsidian, привязки и очередь в профиле Codex.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#865843" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="638" rx="24" fill="#fffaf3" stroke="#e5d7c9" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="40" y="42" fill="#9b4d31" font-size="13" font-weight="700" letter-spacing="2">УСТРОЙСТВО ПАКЕТА</text>
    <text x="40" y="82" fill="#322921" font-size="30" font-weight="700">Координатор включается через /faust-mode</text>
    <text x="40" y="127" fill="#6e6259" font-size="16">В пакете fstack</text>
    <text x="630" y="127" fill="#6e6259" font-size="16">В рабочем окружении</text>

    <rect x="40" y="148" width="330" height="112" rx="15" fill="#ffffff" stroke="#d9ccbf"/>
    <rect x="40" y="148" width="6" height="112" rx="3" fill="#cf7048"/>
    <text x="65" y="184" fill="#9b4d31" font-size="15" font-weight="700">skills/</text>
    <text x="65" y="216" fill="#322921" font-size="23" font-weight="700">Навыки и справки</text>
    <text x="65" y="242" fill="#6e6259" font-size="16">Код, тексты, проверка результата</text>
    <path d="M 390 214 H 608" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="197" fill="#6e6259" font-size="15" text-anchor="middle">Codex загружает</text>
    <rect x="630" y="148" width="330" height="112" rx="15" fill="#f9e5d8" stroke="#dfb59d"/>
    <text x="655" y="190" fill="#322921" font-size="23" font-weight="700">Методы в чате</text>
    <text x="655" y="221" fill="#644a3d" font-size="16">По смыслу задачи или явно</text>
    <text x="655" y="245" fill="#644a3d" font-size="16">через $fstack:имя</text>

    <rect x="40" y="294" width="330" height="112" rx="15" fill="#ffffff" stroke="#d9ccbf"/>
    <rect x="40" y="294" width="6" height="112" rx="3" fill="#69889a"/>
    <text x="65" y="330" fill="#426578" font-size="15" font-weight="700">delegate-work</text>
    <text x="65" y="362" fill="#322921" font-size="23" font-weight="700">Порядок поручений</text>
    <text x="65" y="388" fill="#6e6259" font-size="16">Область, метод и критерии</text>
    <path d="M 390 360 H 608" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="343" fill="#6e6259" font-size="15" text-anchor="middle">В faust-mode</text>
    <rect x="630" y="294" width="330" height="112" rx="15" fill="#e7eff3" stroke="#b6cbd5"/>
    <text x="655" y="336" fill="#322921" font-size="23" font-weight="700">Подагенты Codex</text>
    <text x="655" y="367" fill="#435e6c" font-size="16">Доступны в сессии</text>
    <text x="655" y="391" fill="#435e6c" font-size="16">Навык по задаче</text>

    <rect x="40" y="440" width="330" height="112" rx="15" fill="#ffffff" stroke="#d9ccbf"/>
    <rect x="40" y="440" width="6" height="112" rx="3" fill="#718569"/>
    <text x="65" y="476" fill="#526b48" font-size="15" font-weight="700">hooks/ + launchers/</text>
    <text x="65" y="508" fill="#322921" font-size="23" font-weight="700">Память на Rust</text>
    <text x="65" y="534" fill="#6e6259" font-size="16">Готовый бинарник и хуки Codex</text>
    <path d="M 390 506 H 608" fill="none" stroke="#865843" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="489" fill="#6e6259" font-size="15" text-anchor="middle">В обычном чате</text>
    <rect x="630" y="440" width="330" height="112" rx="15" fill="#eaf0e4" stroke="#becdb2"/>
    <text x="655" y="482" fill="#322921" font-size="23" font-weight="700">Память проекта</text>
    <text x="655" y="513" fill="#526547" font-size="16">Markdown в Obsidian</text>
    <text x="655" y="537" fill="#526547" font-size="16">Привязки и очередь в Codex</text>

    <path d="M 40 579 H 960" stroke="#e5d7c9"/>
    <text x="40" y="608" fill="#6e6259" font-size="15">Одобренный фоновый хук подготавливает сборку. Хуки памяти подключают проект к рабочему vault.</text>
  </g>
</svg>
