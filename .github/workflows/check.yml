name: Проверка плагина

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Пакет и установка (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -q
      - run: npm install --global @openai/codex@0.166.0-alpha.6
      - run: python scripts/check_install.py
