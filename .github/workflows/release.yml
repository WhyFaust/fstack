name: fstack

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fstack-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_MANIFEST: tools/fstack/Cargo.toml
  TOOLCHAIN: 1.90.0

jobs:
  package:
    name: Пакет (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, binary: fstack }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, binary: fstack.exe }
          - { os: macos-15-intel, target: x86_64-apple-darwin, binary: fstack }
          - { os: macos-15, target: aarch64-apple-darwin, binary: fstack }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      BINARY: tools/fstack/target/${{ matrix.target }}/release/${{ matrix.binary }}
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '0' || '1' }}
      - name: Rust, сборка и тесты
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          cargo "+$TOOLCHAIN" fmt --manifest-path "$CARGO_MANIFEST" -- --check
          cargo "+$TOOLCHAIN" clippy --all-targets --locked --target "$TARGET" --manifest-path "$CARGO_MANIFEST" -- -D warnings
          cargo "+$TOOLCHAIN" test --release --locked --target "$TARGET" --manifest-path "$CARGO_MANIFEST"
          cargo "+$TOOLCHAIN" build --release --locked --target "$TARGET" --manifest-path "$CARGO_MANIFEST"
      - name: Проверить пакет и версию
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          "$BINARY" --package . check-package .
          "$BINARY" --package . release check
          if [[ -n "$CHANGE_BASE" && "$RUNNER_OS" == "Linux" ]]; then
            "$BINARY" --package . release check-next "$CHANGE_BASE"
          fi
      - name: Проверить доступность версии в GitHub Releases
        if: runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: '"$BINARY" --package . release plan'
      - uses: actions/setup-python@v7
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Тесты измерителя и экспериментов
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tools/fstack/benchmarks -v
          python -m unittest discover -s tools/fstack/evals -v
      - name: Проверить установленный пакет и вызов навыка в Codex
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/fstack-cli" --no-save --no-audit --no-fund @openai/codex@0.169.0
          codex="$RUNNER_TEMP/fstack-cli/node_modules/.bin/codex"
          package="$RUNNER_TEMP/fstack-plugin"
          mkdir -p "$package/bin"
          git archive HEAD | tar -x -C "$package"
          cp "$BINARY" "$package/bin/fstack"
          "$BINARY" --package "$package" check-installation --codex "$codex"
          python tools/fstack/evals/check_doctor.py "$package" --codex "$codex"
          python tools/fstack/evals/check_skill_invocation.py "$package" --codex "$codex"
      - name: Проверить зависимости Linux
        if: runner.os == 'Linux'
        run: |
          ldd "$BINARY"
          readelf --version-info "$BINARY" > "$RUNNER_TEMP/fstack-needed-versions"
          highest=$(grep -o 'GLIBC_[0-9.]*' "$RUNNER_TEMP/fstack-needed-versions" | cut -d _ -f 2 | sort -Vu | tail -1)
          test "$(printf '%s\n2.35\n' "$highest" | sort -Vu | tail -1)" = 2.35
      - name: Проверить зависимости Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $imports = & "$($tools.FullName)\bin\Hostx64\x64\dumpbin.exe" /dependents $env:BINARY
          if ($LASTEXITCODE -ne 0 -or $imports -match '(?i)(VCRUNTIME|MSVCP|sqlite3)[^\s]*\.dll') {
            throw 'Неверные зависимости runtime'
          }
      - name: Собрать артефакт
        run: '"$BINARY" --package . release artifact --target "$TARGET" --binary "$BINARY" --output "$RUNNER_TEMP/native"'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error
          retention-days: 7

  release:
    name: Выпустить пакет
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - name: Сверить сборку и опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          publisher="$RUNNER_TEMP/native/x86_64-unknown-linux-gnu"
          test "$(jq -er .source_sha "$publisher/artifact.json")" = "$GITHUB_SHA"
          test "$(jq -er .sha256 "$publisher/artifact.json")" = "$(sha256sum "$publisher/fstack" | cut -d ' ' -f 1)"
          chmod +x "$publisher/fstack"
          "$publisher/fstack" --package . release publish --artifacts "$RUNNER_TEMP/native"
