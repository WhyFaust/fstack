name: fstack
run-name: ${{ github.event_name == 'pull_request' && format('PR {0} {1} {2}', github.event.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || format('{0} {1}', github.event_name, github.sha) }}

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fstack-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_MANIFEST: tools/fstack/Cargo.toml
  TOOLCHAIN: 1.90.0
  CODEX_CLI_VERSION: 0.171.0

jobs:
  source:
    name: Выбрать ревизию пакета
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      base: ${{ steps.select.outputs.base }}
      workflow_only: ${{ steps.select.outputs.workflow_only }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          base=$CHANGE_BASE
          workflow_only=false
          version=$(jq -er '.version | select(test("^(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)){2}$"))' .codex-plugin/plugin.json)
          outside_workflows=(. ':(exclude).github/workflows')
          if tag=$(git rev-parse --verify --quiet "refs/tags/v$version^{commit}") &&
             ! git diff --quiet "$tag" "$sha" -- .github/workflows &&
             git diff --quiet "$tag" "$sha" -- "${outside_workflows[@]}" &&
             { [[ -z "$base" ]] || git diff --quiet "$base" "$sha" -- "${outside_workflows[@]}"; }; then
            if [[ -n "$base" ]]; then git merge-base --is-ancestor "$base" "$sha"; fi
            sha=$tag
            base=$tag
            workflow_only=true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "workflow_only=$workflow_only" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: source
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    name: Пакет (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, binary: fstack }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, binary: fstack.exe }
          - { os: macos-15-intel, target: x86_64-apple-darwin, binary: fstack }
          - { os: macos-15, target: aarch64-apple-darwin, binary: fstack }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      BINARY: tools/fstack/target/${{ matrix.target }}/release/${{ matrix.binary }}
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Подготовить команду проверки и выбрать исходники пакета
        env:
          PACKAGE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          git show HEAD:.github/workflows/check.py > "$RUNNER_TEMP/fstack-check.py"
          git checkout --detach "$PACKAGE_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Установить зависимости тестов Python
        if: runner.os == 'Linux' && hashFiles('tools/fstack/evals/requirements.txt') != ''
        run: python -m pip install -r tools/fstack/evals/requirements.txt
      - name: Собрать бинарник выпуска
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          cargo "+$TOOLCHAIN" build --release --locked --target "$TARGET" --manifest-path "$CARGO_MANIFEST"
      - name: Выполнить общие проверки
        run: |
          options=()
          if [[ "$RUNNER_OS" != Linux ]]; then options+=(--skip-python-tests); fi
          python "$RUNNER_TEMP/fstack-check.py" --toolchain "$TOOLCHAIN" --target "$TARGET" --binary "$BINARY" "${options[@]}"
      - name: Проверить версию относительно базы
        if: runner.os == 'Linux' && needs.source.outputs.base != ''
        env:
          CHANGE_BASE: ${{ needs.source.outputs.base }}
        run: '"$BINARY" --package . release check-next "$CHANGE_BASE"'
      - name: Проверить доступность версии в GitHub Releases
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_ONLY: ${{ needs.source.outputs.workflow_only }}
        run: |
          plan=$("$BINARY" --package . release plan)
          echo "$plan"
          if [[ "$WORKFLOW_ONLY" == true ]]; then jq -e '.publish == false' <<< "$plan"; fi
      - name: Проверить установленный пакет и вызов навыка в Codex
        # Выпущенный 0.2.11 проверял вызов в Codex только на Linux.
        if: runner.os == 'Linux' || needs.source.outputs.workflow_only == 'false' || needs.source.outputs.version != '0.2.11'
        run: |
          package="$RUNNER_TEMP/fstack-plugin"
          mkdir -p "$package/bin"
          git archive HEAD | (cd "$package" && tar -x)
          cp "$BINARY" "$package/bin/"
          cli_dir="$RUNNER_TEMP/fstack-cli"
          npm install --prefix "$cli_dir" --prefer-online --no-save --no-audit --no-fund "@openai/codex@$CODEX_CLI_VERSION"
          codex=$(python -c 'from pathlib import Path; import sys; paths = [p for p in Path(sys.argv[1]).glob("node_modules/**/vendor/*/bin/codex*") if p.name in {"codex", "codex.exe"} and p.is_file()]; assert len(paths) == 1, paths; print(paths[0].as_posix())' "$cli_dir")
          "$codex" --version
          "$BINARY" --package "$package" check-installation --codex "$codex"
          python tools/fstack/evals/check_doctor.py "$package" --codex "$codex"
          python tools/fstack/evals/check_skill_invocation.py "$package" --codex "$codex"
      - name: Проверить зависимости Linux
        if: runner.os == 'Linux'
        run: |
          ldd "$BINARY"
          readelf --version-info "$BINARY" > "$RUNNER_TEMP/fstack-needed-versions"
          highest=$(grep -o 'GLIBC_[0-9.]*' "$RUNNER_TEMP/fstack-needed-versions" | cut -d _ -f 2 | sort -Vu | tail -1)
          test "$(printf '%s\n2.35\n' "$highest" | sort -Vu | tail -1)" = 2.35
      - name: Проверить зависимости Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $imports = & "$($tools.FullName)\bin\Hostx64\x64\dumpbin.exe" /dependents $env:BINARY
          if ($LASTEXITCODE -ne 0 -or $imports -match '(?i)(VCRUNTIME|MSVCP|sqlite3)[^\s]*\.dll') {
            throw 'Неверные зависимости runtime'
          }
      - name: Собрать артефакт
        run: '"$BINARY" --package . release artifact --target "$TARGET" --binary "$BINARY" --output "$RUNNER_TEMP/native"'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error
          retention-days: 7

  release:
    name: Обновить канал выпуска
    needs: source
    if: needs.source.outputs.workflow_only == 'false' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    concurrency:
      group: fstack-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Собрать издатель из принятой ревизии
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          cargo "+$TOOLCHAIN" build --release --locked --manifest-path "$CARGO_MANIFEST"
      - name: Сверить опубликованные файлы и обновить канал
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tools/fstack/target/release/fstack --package . release promote
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" \
            -f sha="$GITHUB_SHA" -F force=false --silent
